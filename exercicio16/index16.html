<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block e Inline</title>
</head>

<body>

    <h1>Elementos Block e Inline</h1>


    <h2 style="background-color: pink;">Elemento H2 - BLOCK</h2>
    <div style="background-color: lightpink;">
        Este é um elemento DIV - BLOCK
    </div>

    <p style="background-color: pink;">
        Este é um elemento P - BLOCK
    </p>
    <p>
        Este é um exemplo de elementos
        <span style="background-color: #f4a6c1;">SPAN - INLINE</span>
        e
        <strong style="background-color: #ee82a9;">STRONG - INLINE</strong>
        juntos na mesma linha
    </p>

    <p>
        Este é um
        <a href="https://www.google.com" style="background-color: #e88bab;">
            LINK - INLINE
        </a>
        dentro do parágrafo
    </p>

</body>

</html>
