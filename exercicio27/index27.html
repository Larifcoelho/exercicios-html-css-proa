<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Cores</title>

    <style>
        .bloco {
            width: 250px;
            height: 80px;
            margin: 10px;
            padding: 10px;
        }

        .branco {
            color: black;
        }
    </style>
</head>

<body>

    <h1>Laboratório de Cores</h1>

    <div class="bloco" style="background-color: blue;">
        Nome: blue
    </div>

    <div class="bloco" style="background-color: navy;">
        Nome: navy
    </div>

    <div class="bloco" style="background-color: #0000ff;">
        Hexadecimal: #0000ff
    </div>

    <div class="bloco" style="background-color: #1e90ff;">
        Hexadecimal: #1e90ff
    </div>

    <div class="bloco" style="background-color: rgb(0, 0, 255);">
        RGB: rgb(0, 0, 255)
    </div>

    <div class="bloco" style="background-color: rgb(30, 144, 255);">
        RGB: rgb(30, 144, 255)
    </div>

    <div class="bloco" style="background-color: rgba(0, 0, 255, 0.5);">
        RGBA: rgba(0, 0, 255, 0.5)
    </div>

    <div class="bloco" style="background-color: rgba(30, 144, 255, 0.7);">
        RGBA: rgba(30, 144, 255, 0.7)
    </div>

</body>

</html>
