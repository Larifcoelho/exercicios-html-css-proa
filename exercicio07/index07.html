<!DOCTYPE html>
<html lang="pt-br"> <!--lang define o idioma principal do conteúdo da página.-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--width=device-width faz a largura da página se adaptar à largura da tela do dispositivo-->
    <title>7° Página</title> <!--Visível na aba do navegador-->
</head>

<body>
    <main>
        <h1>Carolina Herrera</h1> <!--Título-->
        <br>
        <pre>Perfume 212 VIP Rosé NY Rodeo EDP Feminino Carolina Herrera Edição Limitada</pre>
        <!-- A tag pre estiliza um parágrafo. -->
        <br>
        <img src="img/212rodeo.jpg" alt="Imagem de Perfume Feminino" width="500" height="500">
        <!-- src define o caminho da imagem. -->
        <!-- alt fornece um texto alternativo para a imagem. -->
        <!-- width define a largura da imagem. -->
        <!-- height define a altura da imagem. -->
        <br>
        <a href="https://www.carolinaherrera.com/br/pt/editorial/fragrance-212-vip-rodeo"
            title="Conheça o perfume Carolina Herrera 212 VIP Rosé">Compre o produto por aqui!</a>
        <!-- href define o endereço para onde o link direciona. -->
        <!-- title fornece uma informação adicional sobre o link. -->
    </main>
</body>

</html>
