<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página com Botões</title>
</head>

<body>

    <h1>Página com Botões</h1>

    <h2>Cadastrar</h2>
    <p>O botão cadastrar serve para adicionar uma nova informação</p>
    <button>Cadastrar</button>
    <h2>Editar</h2>
    <p>O botão editar serve para alterar uma informação já cadastrada</p>
    <button>Editar</button>
    <h2>Excluir</h2>
    <p>O botão excluir serve para remover uma informação</p>
    <button>Excluir</button>
    <h2>Voltar</h2>
    <p>O botão voltar serve para retornar para a página anterior</p>
    <button>Voltar</button>

</body>

</html>
